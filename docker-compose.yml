name: timesheet-il-widget

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      AMOCRM_CLIENT_ID: "${AMOCRM_CLIENT_ID:?AMOCRM_CLIENT_ID is required}"
      AMOCRM_CLIENT_SECRET: "${AMOCRM_CLIENT_SECRET:?AMOCRM_CLIENT_SECRET is required}"
      AMOCRM_REDIRECT_URI: "${AMOCRM_REDIRECT_URI:?AMOCRM_REDIRECT_URI is required}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      ENVIRONMENT: production
      DEBUG: "false"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      POLLING_INTERVAL: "${POLLING_INTERVAL:-15}"
      INACTIVITY_TIMEOUT: "${INACTIVITY_TIMEOUT:-300}"
      EVENT_POLL_INTERVAL_SECONDS: "${EVENT_POLL_INTERVAL_SECONDS:-60}"
      RAW_EVENT_RETENTION_DAYS: "${RAW_EVENT_RETENTION_DAYS:-30}"
      INGESTION_WORKER_ENABLED: "${INGESTION_WORKER_ENABLED:-true}"
      INGESTION_MAX_CONCURRENT_ACCOUNTS: "${INGESTION_MAX_CONCURRENT_ACCOUNTS:-8}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - exports_data:/exports
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  exports_data:
