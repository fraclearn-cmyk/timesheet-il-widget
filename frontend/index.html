<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet IL Widget - Тестовый интерфейс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .api-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        .api-status.online {
            background: #d4edda;
            color: #155724;
        }

        .api-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .button:hover {
            background: #5568d3;
        }

        .button.danger {
            background: #dc3545;
        }

        .button.danger:hover {
            background: #c82333;
        }

        .button.success {
            background: #28a745;
        }

        .button.success:hover {
            background: #218838;
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .output {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 15px;
        }

        .output pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.active {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .status-indicator.inactive {
            background: #dc3545;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .session-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .session-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        .session-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Timesheet IL Widget - Тестовый интерфейс</h1>
            <p style="color: #666; margin: 10px 0;">Backend API: <strong>http://localhost:8000</strong></p>
            <div id="apiStatus" class="api-status offline">⚠️ Проверка соединения...</div>
        </div>

        <div class="grid">
            <!-- Рабочие сессии -->
            <div class="card">
                <h2>🕐 Рабочие сессии</h2>
                <div id="sessionInfo" class="session-info" style="display: none;">
                    <p><strong>Статус:</strong> <span id="sessionStatus">-</span></p>
                    <p><strong>ID сессии:</strong> <span id="sessionId">-</span></p>
                    <p><strong>Начало:</strong> <span id="sessionStart">-</span></p>
                </div>
                <div class="input-group">
                    <label>User ID:</label>
                    <input type="number" id="userId" value="1" placeholder="1">
                </div>
                <button class="button success" onclick="startSession()">▶️ Начать смену</button>
                <button class="button" onclick="startBreak()">⏸️ Начать перерыв</button>
                <button class="button" onclick="endBreak()">▶️ Закончить перерыв</button>
                <button class="button danger" onclick="endSession()">⏹️ Завершить смену</button>
                <button class="button" onclick="getCurrentSession()">📊 Текущая сессия</button>
                <div id="sessionOutput" class="output" style="display: none;"></div>
            </div>

            <!-- Активности -->
            <div class="card">
                <h2>📝 Активности</h2>
                <div class="input-group">
                    <label>Entity Type:</label>
                    <select id="entityType">
                        <option value="lead">Сделка (Lead)</option>
                        <option value="contact">Контакт</option>
                        <option value="company">Компания</option>
                        <option value="task">Задача</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Entity ID:</label>
                    <input type="number" id="entityId" value="100" placeholder="100">
                </div>
                <div class="input-group">
                    <label>Category ID:</label>
                    <input type="number" id="categoryId" value="1" placeholder="1">
                </div>
                <button class="button success" onclick="startActivity()">▶️ Начать активность</button>
                <button class="button danger" onclick="stopActivity()">⏹️ Остановить активность</button>
                <button class="button" onclick="pauseActivity()">⏸️ Пауза</button>
                <button class="button" onclick="resumeActivity()">▶️ Продолжить</button>
                <div id="activityOutput" class="output" style="display: none;"></div>
            </div>

            <!-- Категории -->
            <div class="card">
                <h2>🏷️ Категории активностей</h2>
                <div class="input-group">
                    <label>Название категории:</label>
                    <input type="text" id="categoryName" placeholder="Обработка лидов">
                </div>
                <div class="input-group">
                    <label>Цвет:</label>
                    <input type="color" id="categoryColor" value="#667eea">
                </div>
                <button class="button success" onclick="createCategory()">➕ Создать категорию</button>
                <button class="button" onclick="getCategories()">📋 Список категорий</button>
                <div id="categoryOutput" class="output" style="display: none;"></div>
            </div>

            <!-- Команда -->
            <div class="card">
                <h2>👥 Команда</h2>
                <div class="input-group">
                    <label>Дата (YYYY-MM-DD):</label>
                    <input type="date" id="teamDate" value="">
                </div>
                <button class="button" onclick="getTeamStats()">📊 Статистика команды</button>
                <button class="button" onclick="getTeamActivity()">📈 Активность команды</button>
                <div id="teamOutput" class="output" style="display: none;"></div>
            </div>

            <!-- Отчёты -->
            <div class="card">
                <h2>📈 Отчёты</h2>
                <div class="input-group">
                    <label>Начало периода:</label>
                    <input type="date" id="reportStartDate">
                </div>
                <div class="input-group">
                    <label>Конец периода:</label>
                    <input type="date" id="reportEndDate">
                </div>
                <div class="input-group">
                    <label>User ID:</label>
                    <input type="number" id="reportUserId" value="1">
                </div>
                <button class="button" onclick="generateReport()">📊 Генерировать отчёт</button>
                <button class="button" onclick="getReports()">📋 Список отчётов</button>
                <div id="reportOutput" class="output" style="display: none;"></div>
            </div>

            <!-- Настройки -->
            <div class="card">
                <h2>⚙️ Настройки виджета</h2>
                <button class="button" onclick="getSettings()">📋 Получить настройки</button>
                <button class="button success" onclick="updateSettings()">💾 Обновить настройки</button>
                <div id="settingsOutput" class="output" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let currentSessionId = null;
        let currentActivityId = null;

        // Установка текущей даты
        document.getElementById('teamDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('reportStartDate').value = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        document.getElementById('reportEndDate').value = new Date().toISOString().split('T')[0];

        // Проверка API
        async function checkAPI() {
            const statusEl = document.getElementById('apiStatus');
            try {
                const response = await fetch(`${API_URL}/docs`);
                if (response.ok) {
                    statusEl.className = 'api-status online';
                    statusEl.innerHTML = '✅ API онлайн';
                } else {
                    throw new Error('API недоступен');
                }
            } catch (error) {
                statusEl.className = 'api-status offline';
                statusEl.innerHTML = '❌ API оффлайн';
            }
        }

        // Вспомогательная функция для API запросов
        async function apiRequest(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                }
            };
            if (body) {
                options.body = JSON.stringify(body);
            }
            const response = await fetch(`${API_URL}${endpoint}`, options);
            return await response.json();
        }

        function showOutput(elementId, data) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            el.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        function updateSessionInfo(data) {
            const infoEl = document.getElementById('sessionInfo');
            if (data && data.id) {
                currentSessionId = data.id;
                infoEl.style.display = 'block';
                document.getElementById('sessionStatus').textContent = data.status || 'active';
                document.getElementById('sessionId').textContent = data.id;
                document.getElementById('sessionStart').textContent = new Date(data.start_time).toLocaleString('ru-RU');
            }
        }

        // Рабочие сессии
        async function startSession() {
            try {
                const userId = document.getElementById('userId').value;
                const data = await apiRequest('/api/v1/sessions/start', 'POST', {
                    user_id: parseInt(userId),
                    account_id: 1
                });
                updateSessionInfo(data);
                showOutput('sessionOutput', data);
            } catch (error) {
                showOutput('sessionOutput', { error: error.message });
            }
        }

        async function endSession() {
            try {
                const userId = document.getElementById('userId').value;
                const data = await apiRequest('/api/v1/sessions/end', 'POST', {
                    user_id: parseInt(userId)
                });
                currentSessionId = null;
                document.getElementById('sessionInfo').style.display = 'none';
                showOutput('sessionOutput', data);
            } catch (error) {
                showOutput('sessionOutput', { error: error.message });
            }
        }

        async function startBreak() {
            try {
                const userId = document.getElementById('userId').value;
                const data = await apiRequest('/api/v1/sessions/break', 'POST', {
                    user_id: parseInt(userId)
                });
                showOutput('sessionOutput', data);
            } catch (error) {
                showOutput('sessionOutput', { error: error.message });
            }
        }

        async function endBreak() {
            try {
                const userId = document.getElementById('userId').value;
                const data = await apiRequest('/api/v1/sessions/break/end', 'POST', {
                    user_id: parseInt(userId)
                });
                showOutput('sessionOutput', data);
            } catch (error) {
                showOutput('sessionOutput', { error: error.message });
            }
        }

        async function getCurrentSession() {
            try {
                const userId = document.getElementById('userId').value;
                const data = await apiRequest(`/api/v1/sessions/current/${userId}`);
                updateSessionInfo(data);
                showOutput('sessionOutput', data);
            } catch (error) {
                showOutput('sessionOutput', { error: error.message });
            }
        }

        // Активности
        async function startActivity() {
            try {
                const data = await apiRequest('/api/v1/activity/start', 'POST', {
                    user_id: parseInt(document.getElementById('userId').value),
                    entity_type: document.getElementById('entityType').value,
                    entity_id: parseInt(document.getElementById('entityId').value),
                    category_id: parseInt(document.getElementById('categoryId').value)
                });
                currentActivityId = data.id;
                showOutput('activityOutput', data);
            } catch (error) {
                showOutput('activityOutput', { error: error.message });
            }
        }

        async function stopActivity() {
            try {
                const data = await apiRequest('/api/v1/activity/stop', 'POST', {
                    user_id: parseInt(document.getElementById('userId').value)
                });
                currentActivityId = null;
                showOutput('activityOutput', data);
            } catch (error) {
                showOutput('activityOutput', { error: error.message });
            }
        }

        async function pauseActivity() {
            try {
                const data = await apiRequest('/api/v1/activity/pause', 'POST', {
                    user_id: parseInt(document.getElementById('userId').value)
                });
                showOutput('activityOutput', data);
            } catch (error) {
                showOutput('activityOutput', { error: error.message });
            }
        }

        async function resumeActivity() {
            try {
                const data = await apiRequest('/api/v1/activity/resume', 'POST', {
                    user_id: parseInt(document.getElementById('userId').value)
                });
                showOutput('activityOutput', data);
            } catch (error) {
                showOutput('activityOutput', { error: error.message });
            }
        }

        // Категории
        async function createCategory() {
            try {
                const data = await apiRequest('/api/v1/categories', 'POST', {
                    name: document.getElementById('categoryName').value,
                    color: document.getElementById('categoryColor').value,
                    account_id: 1
                });
                showOutput('categoryOutput', data);
            } catch (error) {
                showOutput('categoryOutput', { error: error.message });
            }
        }

        async function getCategories() {
            try {
                const data = await apiRequest('/api/v1/categories/1');
                showOutput('categoryOutput', data);
            } catch (error) {
                showOutput('categoryOutput', { error: error.message });
            }
        }

        // Команда
        async function getTeamStats() {
            try {
                const date = document.getElementById('teamDate').value;
                const data = await apiRequest(`/api/v1/team/stats/1?date=${date}`);
                showOutput('teamOutput', data);
            } catch (error) {
                showOutput('teamOutput', { error: error.message });
            }
        }

        async function getTeamActivity() {
            try {
                const date = document.getElementById('teamDate').value;
                const data = await apiRequest(`/api/v1/team/activity/1?date=${date}`);
                showOutput('teamOutput', data);
            } catch (error) {
                showOutput('teamOutput', { error: error.message });
            }
        }

        // Отчёты
        async function generateReport() {
            try {
                const data = await apiRequest('/api/v1/reports/generate', 'POST', {
                    user_id: parseInt(document.getElementById('reportUserId').value),
                    start_date: document.getElementById('reportStartDate').value,
                    end_date: document.getElementById('reportEndDate').value,
                    account_id: 1
                });
                showOutput('reportOutput', data);
            } catch (error) {
                showOutput('reportOutput', { error: error.message });
            }
        }

        async function getReports() {
            try {
                const userId = document.getElementById('reportUserId').value;
                const data = await apiRequest(`/api/v1/reports/${userId}`);
                showOutput('reportOutput', data);
            } catch (error) {
                showOutput('reportOutput', { error: error.message });
            }
        }

        // Настройки
        async function getSettings() {
            try {
                const data = await apiRequest('/api/v1/settings/1');
                showOutput('settingsOutput', data);
            } catch (error) {
                showOutput('settingsOutput', { error: error.message });
            }
        }

        async function updateSettings() {
            try {
                const data = await apiRequest('/api/v1/settings', 'POST', {
                    account_id: 1,
                    working_hours_start: "09:00:00",
                    working_hours_end: "18:00:00",
                    auto_break_minutes: 60,
                    max_session_hours: 12,
                    activity_timeout_seconds: 300
                });
                showOutput('settingsOutput', data);
            } catch (error) {
                showOutput('settingsOutput', { error: error.message });
            }
        }

        // Проверка API при загрузке
        checkAPI();
        setInterval(checkAPI, 10000); // Проверка каждые 10 секунд
    </script>
</body>
</html>
