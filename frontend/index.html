<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табель учёта рабочего времени</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-badge.working {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.paused {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.stopped {
            background: #f8d7da;
            color: #721c24;
        }

        .timer {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            margin: 20px 0;
        }

        .user-info {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .user-info input {
            width: 100%;
            padding: 12px;
            border: 2px solid #90caf9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .user-info input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-pause {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-end {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .api-status {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .api-status.online {
            background: #d4edda;
            color: #155724;
        }

        .api-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏰ Табель учёта времени</h1>
        <p class="subtitle">Система контроля рабочего времени</p>

        <div id="apiStatus" class="api-status offline">
            🔴 Проверка связи с сервером...
        </div>

        <div id="alert" class="alert"></div>

        <div class="user-info">
            <input type="text" id="userName" placeholder="Введите ваше имя" value="Иван Иванов">
        </div>

        <div class="status">
            <div id="statusBadge" class="status-badge stopped">
                ⭕ Смена не начата
            </div>
            <div id="timer" class="timer">00:00:00</div>
            <div id="sessionInfo" style="color: #666; font-size: 14px;">
                Нажмите "Начать смену" для старта
            </div>
        </div>

        <div class="button-group">
            <button id="btnStart" class="btn-start" onclick="startSession()">
                ▶️ Начать смену
            </button>
            <button id="btnPause" class="btn-pause" onclick="toggleBreak()" disabled>
                ⏸️ Перерыв
            </button>
            <button id="btnEnd" class="btn-end" onclick="endSession()" disabled>
                ⏹️ Завершить смену
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div id="workTime" class="stat-value">0:00</div>
                <div class="stat-label">Время работы</div>
            </div>
            <div class="stat-card">
                <div id="breakTime" class="stat-value">0:00</div>
                <div class="stat-label">Время перерыва</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://storage-turkey-multitask.ngrok-free.dev/api/v1';
        
        let sessionData = {
            sessionId: null,
            startTime: null,
            isWorking: false,
            isPaused: false,
            workSeconds: 0,
            breakSeconds: 0
        };

        let timerInterval = null;

        // Проверка API при загрузке
        async function checkAPI() {
            try {
                const response = await fetch(`${API_URL.replace('/api/v1', '')}/health`);
                if (response.ok) {
                    document.getElementById('apiStatus').className = 'api-status online';
                    document.getElementById('apiStatus').textContent = '✅ Сервер подключен';
                    return true;
                }
            } catch (error) {
                console.error('API недоступен:', error);
            }
            document.getElementById('apiStatus').className = 'api-status offline';
            document.getElementById('apiStatus').textContent = '🔴 Сервер недоступен';
            return false;
        }

        // Начать смену
        async function startSession() {
            const userName = document.getElementById('userName').value.trim();
            if (!userName) {
                showAlert('Введите ваше имя', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/sessions/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        account_id: 'demo_account',
                        user_id: Math.floor(Math.random() * 10000),
                        user_name: userName
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionData.sessionId = data.session_id;
                    sessionData.startTime = new Date();
                    sessionData.isWorking = true;
                    sessionData.isPaused = false;
                    
                    updateUI();
                    startTimer();
                    showAlert('Смена началась!', 'success');
                } else {
                    showAlert('Ошибка при запуске смены', 'error');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Не удалось связаться с сервером', 'error');
            }
        }

        // Перерыв
        async function toggleBreak() {
            if (!sessionData.sessionId) return;

            try {
                const endpoint = sessionData.isPaused ? 'resume' : 'break';
                const response = await fetch(`${API_URL}/sessions/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionData.sessionId,
                        account_id: 'demo_account'
                    })
                });

                if (response.ok) {
                    sessionData.isPaused = !sessionData.isPaused;
                    updateUI();
                    showAlert(sessionData.isPaused ? 'Перерыв начат' : 'Работа возобновлена', 'success');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Ошибка при изменении статуса', 'error');
            }
        }

        // Завершить смену
        async function endSession() {
            if (!sessionData.sessionId) return;

            try {
                const response = await fetch(`${API_URL}/sessions/end`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionData.sessionId,
                        account_id: 'demo_account'
                    })
                });

                if (response.ok) {
                    stopTimer();
                    const workHours = Math.floor(sessionData.workSeconds / 3600);
                    const workMinutes = Math.floor((sessionData.workSeconds % 3600) / 60);
                    showAlert(`Смена завершена! Отработано: ${workHours}ч ${workMinutes}м`, 'success');
                    
                    // Сброс
                    sessionData = {
                        sessionId: null,
                        startTime: null,
                        isWorking: false,
                        isPaused: false,
                        workSeconds: 0,
                        breakSeconds: 0
                    };
                    updateUI();
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showAlert('Ошибка при завершении смены', 'error');
            }
        }

        // Таймер
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (sessionData.isPaused) {
                    sessionData.breakSeconds++;
                } else {
                    sessionData.workSeconds++;
                }
                updateTimer();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            const totalSeconds = sessionData.workSeconds + sessionData.breakSeconds;
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            document.getElementById('timer').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            // Обновить статистику
            const workHours = Math.floor(sessionData.workSeconds / 3600);
            const workMinutes = Math.floor((sessionData.workSeconds % 3600) / 60);
            document.getElementById('workTime').textContent = `${workHours}:${String(workMinutes).padStart(2, '0')}`;
            
            const breakHours = Math.floor(sessionData.breakSeconds / 3600);
            const breakMinutes = Math.floor((sessionData.breakSeconds % 3600) / 60);
            document.getElementById('breakTime').textContent = `${breakHours}:${String(breakMinutes).padStart(2, '0')}`;
        }

        // Обновить интерфейс
        function updateUI() {
            const btnStart = document.getElementById('btnStart');
            const btnPause = document.getElementById('btnPause');
            const btnEnd = document.getElementById('btnEnd');
            const badge = document.getElementById('statusBadge');
            const info = document.getElementById('sessionInfo');

            if (sessionData.isWorking) {
                btnStart.disabled = true;
                btnPause.disabled = false;
                btnEnd.disabled = false;
                
                if (sessionData.isPaused) {
                    badge.className = 'status-badge paused';
                    badge.textContent = '⏸️ Перерыв';
                    btnPause.textContent = '▶️ Продолжить';
                    info.textContent = 'Вы на перерыве';
                } else {
                    badge.className = 'status-badge working';
                    badge.textContent = '✅ Работаю';
                    btnPause.textContent = '⏸️ Перерыв';
                    info.textContent = 'Смена идёт';
                }
            } else {
                btnStart.disabled = false;
                btnPause.disabled = true;
                btnEnd.disabled = true;
                badge.className = 'status-badge stopped';
                badge.textContent = '⭕ Смена не начата';
                info.textContent = 'Нажмите "Начать смену" для старта';
            }
        }

        // Показать уведомление
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            setTimeout(() => {
                alert.className = 'alert';
            }, 3000);
        }

        // Инициализация при загрузке
        window.addEventListener('load', async () => {
            await checkAPI();
            updateUI();
        });
    </script>
</body>
</html>
