# Nginx Configuration Template for Timesheet IL
# Replace DOMAIN with your actual domain

# Never write the opaque amoCRM webhook credential to proxy access logs.
map $uri $timesheet_access_uri {
    ~^/api/v1/webhooks/amocrm/ /api/v1/webhooks/amocrm/[redacted];
    default $uri;
}

log_format timesheet_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $timesheet_access_uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log timesheet_safe;

server {
    listen 80;
    server_name DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect to HTTPS (uncomment after getting SSL)
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }

    # Proxy to backend (comment out after getting SSL)
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

