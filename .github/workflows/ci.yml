name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: timesheet_ci
          POSTGRES_USER: phase8_ci
          POSTGRES_PASSWORD: phase8_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase8_ci -d timesheet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://phase8_ci:phase8_ci@127.0.0.1:5432/timesheet_ci
      TEST_POSTGRES_ADMIN_URL: postgresql://phase8_ci:phase8_ci@127.0.0.1:5432/postgres
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      AMOCRM_CLIENT_ID: ci-client-id
      AMOCRM_CLIENT_SECRET: ci-client-secret
      AMOCRM_REDIRECT_URI: https://example.invalid/oauth/callback
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting and Python syntax
        run: |
          mapfile -t phase_python < <(git diff --name-only --diff-filter=ACMR 68124cd..HEAD -- '*.py')
          python -m black --check "${phase_python[@]}" validate_widget_zip.py test_widget_package.py
          python -m compileall -q backend/app backend/migrations backend/tests validate_widget_zip.py test_widget_package.py
          git diff --check 68124cd..HEAD

      - name: Upgrade database and verify one Alembic head
        working-directory: backend
        run: |
          python -m alembic upgrade head
          heads="$(python -m alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          test "$heads" = "014 (head)"
          current="$(python -m alembic current)"
          printf '%s\n' "$current"
          printf '%s\n' "$current" | grep -F '014 (head)'

      - name: Run complete backend suite on PostgreSQL 15
        working-directory: backend
        run: python -m pytest -q --tb=short

      - name: Run all Node tests
        run: node --test frontend/tests/*.test.js

      - name: Run all browser tests
        run: npx playwright test frontend/tests/*.spec.js --workers=1 --reporter=line

      - name: Test and build exact widget package
        run: |
          sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
          python -m unittest test_widget_package.py
          pwsh -NoProfile -File ./build_widget.ps1
          python validate_widget_zip.py widget.zip

      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: timesheet
          POSTGRES_USER: timesheet
          POSTGRES_PASSWORD: ci-compose-only-password
          DATABASE_URL: postgresql://timesheet:ci-compose-only-password@db/timesheet
          AMOCRM_CLIENT_ID: ci-client-id
          AMOCRM_CLIENT_SECRET: ci-client-secret
          AMOCRM_REDIRECT_URI: https://example.invalid/oauth/callback
          SECRET_KEY: ci-compose-only-secret-key-with-at-least-32-characters
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build production backend image
        run: docker build --file backend/Dockerfile --tag timesheet-backend:ci backend
